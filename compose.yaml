services:
  postgres:
    image: postgres:17
    container_name: catcafe-postgres
    environment:
      POSTGRES_DB: catcafe
      POSTGRES_USER: catcafe
      POSTGRES_PASSWORD: catcafe
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: